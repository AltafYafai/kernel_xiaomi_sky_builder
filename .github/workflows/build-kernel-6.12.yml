name: Build Xiaomi Sky Kernel 6.12 (lineage-24.0-6.12)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-24.0-6.12'
      DEVICETREES_BRANCH:
        description: 'Devicetrees Source Branch'
        required: true
        default: 'lineage-24.0-6.12'
      MODULES_BRANCH:
        description: 'Modules Source Branch'
        required: true
        default: 'lineage-24.0-6.12'
      TELEGRAM_CHAT_ID:
        description: 'Telegram Chat ID (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Telegram Helper
        run: |
          mkdir -p .telegram
          cat << 'EOF' > .telegram/tg.sh
          #!/usr/bin/env bash
          BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-${INPUT_TELEGRAM_CHAT_ID}}"

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram credentials missing, skipping telegram update."
            exit 0
          fi

          ACTION="$1"
          TEXT="$2"
          MSG_ID_FILE="/tmp/tg_msg_id.txt"

          if [ "$ACTION" = "start" ]; then
            RES=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${TEXT}")
            MSG_ID=$(echo "$RES" | jq -r '.result.message_id' 2>/dev/null || true)
            if [ -n "$MSG_ID" ] && [ "$MSG_ID" != "null" ]; then
              echo "$MSG_ID" > "$MSG_ID_FILE"
            fi
          elif [ "$ACTION" = "update" ]; then
            if [ -f "$MSG_ID_FILE" ]; then
              MSG_ID=$(cat "$MSG_ID_FILE")
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_id=${MSG_ID}" \
                -d "parse_mode=HTML" \
                -d "text=${TEXT}" > /dev/null
            else
              $0 start "$TEXT"
            fi
          elif [ "$ACTION" = "send_document" ]; then
            FILE_PATH="$2"
            CAPTION="$3"
            curl -s -F "chat_id=${CHAT_ID}" \
              -F "document=@${FILE_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" > /dev/null
          fi
          EOF
          chmod +x .telegram/tg.sh

      - name: Notify Build Started (0%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh start "<b>🔨 Xiaomi Sky Linux 6.12 Kernel Build Started</b>%0A%0A<b>Progress:</b> [░░░░░░░░░░] 0%%0A<b>Step:</b> Initializing Build Environment"

      - name: Install dependencies and Clang 18 (15%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [█░░░░░░░░░] 15%%0A<b>Step:</b> Installing Clang 18 and build dependencies..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ccache libssl-dev bison flex libelf-dev libdw-dev build-essential zip curl \
            libncurses-dev bc python3 python3-pip rsync u-boot-tools \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-18 lld-18 llvm-18 jq lz4 cpio kmod

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100

      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-6.12-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-6.12-ccache-
            ${{ runner.os }}-kernel-ccache-

      - name: Clone 6.12 Kernel, Devicetrees & Modules (30%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [███░░░░░░░] 30%%0A<b>Step:</b> Cloning 6.12 Kernel and Devicetrees..."
          mkdir -p workspace
          cd workspace

          AUTH_HEADER="x-access-token:${GH_TOKEN}"

          echo "Cloning android_kernel_xiaomi_sm4450-6.12..."
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-6.12.git kernel

          echo "Cloning android_kernel_xiaomi_sm4450-devicetrees-6.12..."
          git clone --depth=1 -b ${{ github.event.inputs.DEVICETREES_BRANCH }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-devicetrees-6.12.git sm4450-devicetrees

          echo "Cloning android_kernel_xiaomi_sm4450-modules-6.12..."
          git clone --depth=1 -b ${{ github.event.inputs.MODULES_BRANCH }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-modules-6.12.git sm4450-modules

          cd kernel
          echo "KERNEL_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build 6.12 Kernel Image & Device Trees (70%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [███████░░░] 70%%0A<b>Step:</b> Compiling Kernel Image & DTBs (Clang 18 LLVM=1)..."
          cd workspace/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=AltafYafai

          # Configure ccache for maximum compilation speed
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="10G"
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=5
          export CCACHE_SLOPPY=time_macros,include_file_mtime,file_macro
          ccache -z

          # Setup devicetrees directly inside arch/arm64/boot/dts/qcom
          echo "Setting up Devicetrees inside arch/arm64/boot/dts/qcom..."
          cp -r ../sm4450-devicetrees/qcom/* arch/arm64/boot/dts/qcom/

          # Append unconditional Sky DTB targets to arch/arm64/boot/dts/qcom/Makefile
          cat << 'DTB_EOF' >> arch/arm64/boot/dts/qcom/Makefile

# Unconditional targets for Xiaomi Sky (Redmi 12 5G / POCO M6 Pro 5G)
DTC_FLAGS += -@
dtb-y += ravelin-sky-base.dtb
dtb-y += ravelin-sky-4gb-base.dtb
dtb-y += ravelin-sky-overlay.dtbo
dtb-y += ravelin-sky-4gb-overlay.dtbo
DTB_EOF

          # Ensure arch/arm64/boot/dts/Makefile descends into qcom
          echo 'subdir-y += qcom' > arch/arm64/boot/dts/Makefile
          rm -rf arch/arm64/boot/dts/vendor

          mkdir -p out
          echo "Configuring gki_defconfig..."
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

          echo "Merging vendor sky_GKI.config..."
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sky_GKI.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig

          echo "Compiling Linux 6.12 Kernel Image and DTBs..."
          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_FLAGS="-@" \
            Image dtbs 2>&1 | tee make.log

          echo "=== Verifying DTB Compilation ==="
          ls -la out/arch/arm64/boot/dts/qcom/*sky* 2>/dev/null || true
          if [ ! -f out/arch/arm64/boot/dts/qcom/ravelin-sky-base.dtb ]; then
            echo "FATAL ERROR: out/arch/arm64/boot/dts/qcom/ravelin-sky-base.dtb was not compiled!"
            echo "Printing make.log DTB section:"
            grep -E "DTC|dtb|DTS|error" make.log | tail -n 50
            exit 1
          fi

          echo "Compiling Linux 6.12 In-Tree Modules..."
          make -k -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log || true

          echo "Compiling Xiaomi Out-of-Tree Modules..."
          make -k -j$(nproc --all) -C $PWD O=out \
            M=$(realpath ../sm4450-modules/xiaomi) \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log || true

          echo "Compiling Qualcomm Display Drivers (msm_drm)..."
          make -k -j$(nproc --all) -C $PWD O=out \
            M=$(realpath ../sm4450-modules/qcom/opensource/display-drivers/msm) \
            DISPLAY_ROOT=$(realpath ../sm4450-modules/qcom/opensource/display-drivers) \
            CONFIG_ARCH_RAVELIN=y \
            KERNEL_SRC=$PWD \
            KERNEL_ROOT=$PWD \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log || true

          echo "=== CCACHE STATISTICS ==="
          ccache -s

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image (out/arch/arm64/boot/Image) was not generated!"
            exit 1
          fi

      - name: Save Ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-6.12-ccache-${{ github.run_id }}

      - name: Package Boot, Vendor Boot & DTBO Images (85%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [████████░░] 85%%0A<b>Step:</b> Building boot, vendor_boot, and dtbo images..." || true
          cd workspace
          mkdir -p artifacts

          echo "1. Generating header v4 boot-6.12.img..."
          bash ../scripts/build_boot.sh kernel/out/arch/arm64/boot/Image artifacts/boot-6.12.img

          echo "2. Generating dtbo-6.12.img..."
          SKY_DTBOS=$(find kernel/out/arch/arm64/boot/dts -name "*sky*.dtbo" 2>/dev/null | sort -r | tr '\n' ' ')
          if [ -n "${SKY_DTBOS// }" ]; then
            echo "Packing compiled DTBOs: $SKY_DTBOS"
            python3 ../scripts/mkdtboimg.py create artifacts/dtbo-6.12.img --page_size=4096 $SKY_DTBOS || true
          fi
          if [ ! -f artifacts/dtbo-6.12.img ] || [ ! -s artifacts/dtbo-6.12.img ]; then
            echo "Using reference LineageOS dtbo.img..."
            gh release download lineageos-24.0-reference -p "dtbo.img" -O artifacts/dtbo-6.12.img -R AltafYafai/kernel_xiaomi_sky_builder 2>/dev/null || true
          fi

          echo "3. Generating vendor_boot-6.12.img (with 6.12 modules in Fragment 0 & OrangeFox in Fragment 1)..."
          bash ../scripts/build_vendor_boot.sh kernel/out/arch/arm64/boot/dts . artifacts/vendor_boot-6.12.img

          ls -lh artifacts/

      - name: Prepare AnyKernel3 Zip & Fastboot Bundle (95%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [█████████░] 95%%0A<b>Step:</b> Packaging AnyKernel3 & Fastboot flashables..." || true
          cd workspace
          git clone --depth=1 https://github.com/AltafYafai/AnyKernel3.git AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f artifacts/dtbo-6.12.img ] && cp artifacts/dtbo-6.12.img AnyKernel3/dtbo.img
          [ -f artifacts/vendor_boot-6.12.img ] && cp artifacts/vendor_boot-6.12.img AnyKernel3/vendor_boot.img

          # Flatten base Sky device trees
          find kernel/out/arch/arm64/boot/dts -name "*sky*base.dtb" -exec cat {} + > AnyKernel3/dtb || true
          [ -s AnyKernel3/dtb ] || rm -f AnyKernel3/dtb

          # Collect all compiled hardware modules (.ko)
          mkdir -p AnyKernel3/modules
          find kernel/out sm4450-modules -name "*.ko" -exec cp {} AnyKernel3/modules/ \; || true
          llvm-strip --strip-debug AnyKernel3/modules/*.ko 2>/dev/null || true

          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Sky Linux 6.12 LTS Kernel for Redmi 12 5G/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=sky/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi12_5g/' anykernel.sh
          sed -i 's/block=.*/block=boot;/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh

          # Inject flash_generic vendor_boot and flash_dtbo triggers
          if ! grep -q "flash_generic vendor_boot" anykernel.sh; then
            sed -i '/## end boot install/i [ -f vendor_boot.img ] \&\& flash_generic vendor_boot' anykernel.sh
          fi
          if ! grep -q "flash_dtbo" anykernel.sh; then
            sed -i '/## end boot install/i [ -f dtbo.img ] \&\& flash_dtbo' anykernel.sh
          fi

          zip -r9 ../sky-kernel-6.12-${{ env.KERNEL_REV }}.zip * -x .git\* README.md
          cd ..

          # Create Fastboot flashing package
          mkdir -p fastboot_bundle
          cp artifacts/boot-6.12.img fastboot_bundle/boot.img
          cp artifacts/vendor_boot-6.12.img fastboot_bundle/vendor_boot.img
          [ -f artifacts/dtbo-6.12.img ] && cp artifacts/dtbo-6.12.img fastboot_bundle/dtbo.img

          cat << 'EOF' > fastboot_bundle/flash.sh
          #!/usr/bin/env bash
          set -e
          echo "=== Flashing Sky Linux 6.12 Kernel ==="
          fastboot flash boot boot.img
          fastboot flash vendor_boot vendor_boot.img
          [ -f dtbo.img ] && fastboot flash dtbo dtbo.img
          echo "=== Flashing Complete! Rebooting... ==="
          fastboot reboot
          EOF
          chmod +x fastboot_bundle/flash.sh

          cat << 'EOF' > fastboot_bundle/flash.bat
          @echo off
          echo === Flashing Sky Linux 6.12 Kernel ===
          fastboot flash boot boot.img
          fastboot flash vendor_boot vendor_boot.img
          if exist dtbo.img fastboot flash dtbo dtbo.img
          echo === Flashing Complete! Rebooting... ===
          fastboot reboot
          EOF

          cd fastboot_bundle
          zip -r9 ../sky-fastboot-6.12-${{ env.KERNEL_REV }}.zip *
          cd ..

          cp artifacts/*.img .

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sky-kernel-6.12-${{ env.KERNEL_REV }}
          path: |
            workspace/sky-kernel-6.12-*.zip
            workspace/sky-fastboot-6.12-*.zip
            workspace/*.img

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          TAG_NAME="sky-6.12-${{ env.KERNEL_REV }}-$(date +%Y%m%d-%H%M)"
          echo "Publishing GitHub release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            workspace/sky-kernel-6.12-*.zip \
            workspace/sky-fastboot-6.12-*.zip \
            workspace/*.img \
            --title "Sky Linux 6.12 Kernel ($TAG_NAME)" \
            --notes "Linux 6.12 GKI LTS build for Xiaomi Redmi 12 5G / POCO M6 Pro 5G (sky). Includes AnyKernel3 recovery zip, 1-click Fastboot bundle, boot, vendor_boot (with 6.12 modules and DTBs), and dtbo images." || true

      - name: Notify Build Complete (100%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>✅ Xiaomi Sky Linux 6.12 Kernel Build Completed!</b>%0A%0A<b>Progress:</b> [██████████] 100%%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Success! Uploading packages..." || true
          ZIP_FILE=$(ls workspace/sky-kernel-6.12-*.zip 2>/dev/null | head -n1)
          if [ -f "$ZIP_FILE" ]; then
            ./.telegram/tg.sh send_document "$ZIP_FILE" "<b>📦 Flashable Recovery Zip:</b> $(basename $ZIP_FILE)" || true
          fi
          FASTBOOT_ZIP=$(ls workspace/sky-fastboot-6.12-*.zip 2>/dev/null | head -n1)
          if [ -f "$FASTBOOT_ZIP" ]; then
            ./.telegram/tg.sh send_document "$FASTBOOT_ZIP" "<b>⚡ Fastboot Flash Package:</b> $(basename $FASTBOOT_ZIP)" || true
          fi

      - name: Handle Build Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p /tmp/logs
          LOG_FILE="/tmp/logs/build_error_${{ github.run_id }}.log"
          
          echo "=== BUILD FAILURE LOG REPORT ===" > "$LOG_FILE"
          echo "Run ID: ${{ github.run_id }}" >> "$LOG_FILE"
          echo "Workflow: ${{ github.workflow }}" >> "$LOG_FILE"
          echo "Commit: ${{ env.KERNEL_REV }}" >> "$LOG_FILE"
          echo "Timestamp: $(date -u)" >> "$LOG_FILE"
          echo -e "\n=== ERROR DETAILS ===" >> "$LOG_FILE"
          
          if [ -f workspace/kernel/make.log ]; then
            tail -n 250 workspace/kernel/make.log >> "$LOG_FILE"
          elif [ -f workspace/kernel/out/make.log ]; then
            tail -n 250 workspace/kernel/out/make.log >> "$LOG_FILE"
          else
            echo "Step failed before compilation log creation." >> "$LOG_FILE"
          fi

          ./.telegram/tg.sh update "<b>❌ Xiaomi Sky Linux 6.12 Build Failed!</b>%0A%0A<b>Run ID:</b> ${{ github.run_id }}%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Failed! See attached error log."
          ./.telegram/tg.sh send_document "$LOG_FILE" "<b>📄 Build Error Log:</b> build_error_${{ github.run_id }}.log" || true
