name: Build Xiaomi Sky Kernel 6.12 (lineage-24.0-6.12)

# Keep only one Sky 6.12 build active; newer source pushes supersede older builds.
concurrency:
  group: sky-6.12-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/6.12-platform-port
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'work/6.12-platform-port'
      DEVICETREES_BRANCH:
        description: 'Devicetrees Source Branch'
        required: true
        default: 'work/6.12-platform-port'
      MODULES_BRANCH:
        description: 'Modules Source Branch'
        required: true
        default: 'work/6.12-display-port'
      TELEGRAM_CHAT_ID:
        description: 'Telegram Chat ID (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Telegram Helper
        run: |
          mkdir -p .telegram
          cat << 'EOF' > .telegram/tg.sh
          #!/usr/bin/env bash
          BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-${INPUT_TELEGRAM_CHAT_ID}}"

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram credentials missing, skipping telegram update."
            exit 0
          fi

          ACTION="$1"
          TEXT="$2"
          MSG_ID_FILE="/tmp/tg_msg_id.txt"

          if [ "$ACTION" = "start" ]; then
            RES=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${TEXT}")
            MSG_ID=$(echo "$RES" | jq -r '.result.message_id' 2>/dev/null || true)
            if [ -n "$MSG_ID" ] && [ "$MSG_ID" != "null" ]; then
              echo "$MSG_ID" > "$MSG_ID_FILE"
            fi
          elif [ "$ACTION" = "update" ]; then
            if [ -f "$MSG_ID_FILE" ]; then
              MSG_ID=$(cat "$MSG_ID_FILE")
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_id=${MSG_ID}" \
                -d "parse_mode=HTML" \
                -d "text=${TEXT}" > /dev/null
            else
              $0 start "$TEXT"
            fi
          elif [ "$ACTION" = "send_document" ]; then
            FILE_PATH="$2"
            CAPTION="$3"
            curl -s -F "chat_id=${CHAT_ID}" \
              -F "document=@${FILE_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" > /dev/null
          fi
          EOF
          chmod +x .telegram/tg.sh

      - name: Notify Build Started (0%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh start "<b>🔨 Xiaomi Sky Linux 6.12 Kernel Build Started</b>%0A%0A<b>Progress:</b> [░░░░░░░░░░] 0%%0A<b>Step:</b> Initializing Build Environment"

      - name: Install dependencies and Clang 18 (15%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [█░░░░░░░░░] 15%%0A<b>Step:</b> Installing Clang 18 and build dependencies..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ccache libssl-dev bison flex libelf-dev libdw-dev build-essential zip curl \
            libncurses-dev bc python3 python3-pip rsync u-boot-tools \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-18 lld-18 llvm-18 jq lz4 cpio kmod

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100

      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-6.12-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-6.12-ccache-
            ${{ runner.os }}-kernel-ccache-

      - name: Clone 6.12 Kernel, Devicetrees & Modules (30%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [███░░░░░░░] 30%%0A<b>Step:</b> Cloning 6.12 Kernel and Devicetrees..."
          mkdir -p workspace
          cd workspace

          AUTH_HEADER="x-access-token:${GH_TOKEN}"

          # The custom kernel repository currently contains vendor overlays,
          # not a complete kernel source tree. Always build on Android Common
          # Kernel 6.12 and overlay only the vendor headers from that repository.
          echo "Cloning Android Common Kernel android16-6.12 baseline..."
          git clone --depth=1 -b android16-6.12 \
            https://android.googlesource.com/kernel/common kernel

          echo "Cloning Sky 6.12 vendor kernel overlay..."
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH || 'work/6.12-platform-port' }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-6.12.git kernel-overlay

          if [ -d kernel-overlay/include ]; then
            rsync -a kernel-overlay/include/ kernel/include/
          fi

          mkdir -p kernel/arch/arm64/configs/vendor
          curl --fail --silent --show-error -L \
            -o kernel/arch/arm64/configs/vendor/sky_GKI.config \
            https://raw.githubusercontent.com/AltafYafai/kernel_xiaomi_sky/lineage-23.1/arch/arm64/configs/vendor/sky_GKI.config

          cd kernel
          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/sky_GKI.config

          # Keep the kernel, device-tree and module checkouts as siblings.
          # The build step expects workspace/{kernel,sm4450-devicetrees,sm4450-modules}.
          cd ..

          echo "Cloning android_kernel_xiaomi_sm4450-devicetrees-6.12..."
          git clone --depth=1 -b ${{ github.event.inputs.DEVICETREES_BRANCH || 'work/6.12-platform-port' }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-devicetrees-6.12.git sm4450-devicetrees

          echo "Cloning android_kernel_xiaomi_sm4450-modules-6.12..."
          git clone --depth=1 -b ${{ github.event.inputs.MODULES_BRANCH || 'work/6.12-display-port' }} \
            https://${AUTH_HEADER}@github.com/AltafYafai/android_kernel_xiaomi_sm4450-modules-6.12.git sm4450-modules

          cd kernel
          echo "KERNEL_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build 6.12 Kernel Image & Device Trees (70%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [███████░░░] 70%%0A<b>Step:</b> Compiling Kernel Image & DTBs (Clang 18 LLVM=1)..."
          cd workspace/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=AltafYafai

          # Configure ccache for maximum compilation speed
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="10G"
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=5
          export CCACHE_SLOPPY=time_macros,include_file_mtime,file_macro
          ccache -z

          # The work/6.12-platform-port ref in the kernel repository is a
          # header-only commit tree, not a complete kernel checkout. Build from
          # the full ACK 6.12 branch and import the matching Qualcomm headers.
          mkdir -p include/linux/soc/qcom include/linux/pinctrl include/linux/gunyah include/uapi/linux include/soc/qcom
          HEADER_BASE="https://raw.githubusercontent.com/xiaomi-ravelin/android_kernel_xiaomi_sm4450/lineage-24.0"
          for header in \
            include/linux/qcom-iommu-util.h \
            include/linux/gunyah/gh_irq_lend.h \
            include/linux/gunyah/gh_common.h \
            include/linux/gunyah/gh_rm_drv.h \
            include/linux/qcom-dma-mapping.h \
            include/linux/qtee_shmbridge.h \
            include/linux/pinctrl/qcom-pinctrl.h \
            include/linux/qti-smmu-proxy-callbacks.h \
            include/linux/msm_dma_iommu_mapping.h \
            include/linux/soc/qcom/llcc-qcom.h \
            include/linux/soc/qcom/spmi-pmic-arb.h \
            include/soc/qcom/minidump.h \
            include/soc/qcom/secure_buffer.h \
            include/soc/qcom/of_common.h \
            include/soc/qcom/rpmh.h \
            include/soc/qcom/cmd-db.h; do
            echo "Importing Qualcomm compatibility header: $header"
            curl --fail --location --retry 3 --silent --show-error \
              "$HEADER_BASE/$header" -o "$header"
            test -s "$header"
          done

          # Import the matching SM4450 provider implementations missing from ACK 6.12.
          # These are real vendor implementations, not MODPOST stubs.
          VENDOR_BASE="https://raw.githubusercontent.com/xiaomi-ravelin/android_kernel_xiaomi_sm4450/lineage-24.0"
          fetch_vendor_file() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            curl --fail --location --retry 3 --silent --show-error \
              "$VENDOR_BASE/$path" -o "$path"
            test -s "$path" || { echo "FATAL ERROR: empty vendor source $path"; exit 1; }
          }

          echo "Importing complete SM4450 Qualcomm platform providers..."
          while IFS= read -r path; do
            [ -n "$path" ] && fetch_vendor_file "$path"
          done <<'VENDOR_FILES'
          drivers/pinctrl/qcom/pinctrl-msm.c
          drivers/spmi/spmi-pmic-arb.c
          drivers/soc/qcom/rpmh.c
          drivers/soc/qcom/rpmh-rsc.c
          drivers/soc/qcom/rpmh-internal.h
          drivers/soc/qcom/trace-rpmh.h
          drivers/soc/qcom/mem_buf/Kconfig
          drivers/soc/qcom/mem_buf/Makefile
          drivers/soc/qcom/mem_buf/mem-buf-dev-gh.c
          drivers/soc/qcom/mem_buf/mem-buf-dev.c
          drivers/soc/qcom/mem_buf/mem-buf-dev.h
          drivers/soc/qcom/mem_buf/mem-buf-gh.c
          drivers/soc/qcom/mem_buf/mem-buf-gh.h
          drivers/soc/qcom/mem_buf/mem-buf-ids.c
          drivers/soc/qcom/mem_buf/mem-buf-ids.h
          drivers/soc/qcom/mem_buf/mem-buf-msgq.c
          drivers/soc/qcom/mem_buf/mem-buf-msgq.h
          drivers/soc/qcom/mem_buf/mem-buf.c
          drivers/soc/qcom/mem_buf/mem_buf_dma_buf.c
          drivers/soc/qcom/mem_buf/trace-mem-buf.h
          drivers/iommu/qcom-iommu-util.c
          drivers/iommu/qcom-dma-iommu-generic.c
          drivers/iommu/qcom-dma-iommu-generic.h
          drivers/iommu/qcom-io-pgtable-arm.c
          drivers/iommu/qcom-io-pgtable-alloc.c
          drivers/iommu/qcom-io-pgtable-alloc.h
          drivers/iommu/io-pgtable-fast.c
          drivers/iommu/dma-mapping-fast.c
          drivers/dma-buf/heaps/deferred-free-helper.h
          drivers/dma-buf/heaps/qcom_dma_heap_priv.h
          drivers/dma-buf/heaps/qcom_sg_ops.h
          include/linux/pinctrl/qcom-pinctrl.h
          include/linux/soc/qcom/spmi-pmic-arb.h
          include/linux/mem-buf.h
          include/linux/mem-buf-exporter.h
          include/linux/mem-buf-altmap.h
          include/uapi/linux/mem-buf.h
          include/linux/dma-mapping-fast.h
          include/linux/io-pgtable-fast.h
          include/linux/qcom-io-pgtable.h
          include/linux/qcom-iommu-util.h
          include/soc/qcom/rpmh.h
          include/soc/qcom/tcs.h
          include/soc/qcom/crm.h
          include/soc/qcom/secure_buffer.h
          include/dt-bindings/soc/qcom,rpmh-rsc.h
          include/trace/hooks/iommu.h
          VENDOR_FILES

          # Adapt downstream Qualcomm providers to the Android 16 / Linux
          # 6.12 interfaces before compiling them as external modules.
          python3 - <<'PY'
          from pathlib import Path

          mem_buf = Path("drivers/soc/qcom/mem_buf/mem-buf.c")
          data = mem_buf.read_text()
          old = "static int mem_buf_msgq_remove(struct platform_device *pdev)"
          if old in data:
              data = data.replace(old, "static void mem_buf_msgq_remove(struct platform_device *pdev)", 1)
              old_return = "\tmem_buf_msgq_free(&pdev->dev);\n\treturn 0;\n}"
              if old_return not in data:
                  raise SystemExit("mem-buf: expected legacy remove callback body not found")
              data = data.replace(old_return, "\tmem_buf_msgq_free(&pdev->dev);\n}", 1)
          mem_buf.write_text(data)

          mem_buf_dev = Path("drivers/soc/qcom/mem_buf/mem-buf-dev.c")
          data = mem_buf_dev.read_text()
          old = "static int mem_buf_remove(struct platform_device *pdev)"
          if old in data:
              data = data.replace(old, "static void mem_buf_remove(struct platform_device *pdev)", 1)
              old_return = "\tmem_buf_dev = NULL;\n\treturn 0;\n}"
              if old_return not in data:
                  raise SystemExit("mem-buf-dev: expected legacy remove callback body not found")
              data = data.replace(old_return, "\tmem_buf_dev = NULL;\n}", 1)
          mem_buf_dev.write_text(data)

          pgtable = Path("drivers/iommu/qcom-io-pgtable-alloc.c")
          data = pgtable.read_text()
          old_shrinker = ("static struct shrinker io_pgtable_alloc_shrinker = {\n"
                          "\t.count_objects = io_pgtable_alloc_count_objects,\n"
                          "\t.scan_objects = io_pgtable_alloc_scan_objects,\n"
                          "\t.seeks = DEFAULT_SEEKS,\n};")
          if old_shrinker not in data:
              raise SystemExit("qcom io-pgtable: expected legacy static shrinker not found")
          data = data.replace(old_shrinker, "static struct shrinker *io_pgtable_alloc_shrinker;", 1)
          old_register = "return register_shrinker(&io_pgtable_alloc_shrinker, \"io_pgtable_alloc\");"
          if old_register in data:
              replacement = ("io_pgtable_alloc_shrinker = shrinker_alloc(0, \"io_pgtable_alloc\");\n"
                             "\tif (!io_pgtable_alloc_shrinker)\n\t\treturn -ENOMEM;\n"
                             "\tio_pgtable_alloc_shrinker->count_objects = io_pgtable_alloc_count_objects;\n"
                             "\tio_pgtable_alloc_shrinker->scan_objects = io_pgtable_alloc_scan_objects;\n"
                             "\tio_pgtable_alloc_shrinker->seeks = DEFAULT_SEEKS;\n"
                             "\tshrinker_register(io_pgtable_alloc_shrinker);\n\treturn 0;")
              data = data.replace(old_register, replacement, 1)
          data = data.replace("unregister_shrinker(&io_pgtable_alloc_shrinker);",
                              "shrinker_free(io_pgtable_alloc_shrinker);")
          if "register_shrinker(" in data or "unregister_shrinker(" in data:
              raise SystemExit("qcom io-pgtable: legacy shrinker API remains")
          pgtable.write_text(data)

          trace_rpmh = Path("drivers/soc/qcom/trace-rpmh.h")
          data = trace_rpmh.read_text()
          data = data.replace("__assign_str(name, d->name)", "__assign_str(name)")
          if "__assign_str(name," in data:
              raise SystemExit("RPMh trace events retain the pre-6.12 __assign_str API")
          trace_rpmh.write_text(data)

          iommu_util = Path("drivers/iommu/qcom-iommu-util.c")
          data = iommu_util.read_text()
          old = ("\tconst struct iommu_ops *ops = dev->bus->iommu_ops;\n\n"
                 "\tif (ops && ops->get_resv_regions)\n"
                 "\t\tops->get_resv_regions(dev, list);")
          if old not in data:
              raise SystemExit("qcom IOMMU utility: expected legacy reserved-region helper not found")
          if "#include <linux/iommu.h>" not in data:
              data = data.replace("#include <linux/module.h>\n",
                                  "#include <linux/module.h>\n#include <linux/iommu.h>\n", 1)
          data = data.replace(old, "\tiommu_get_resv_regions(dev, list);", 1)
          iommu_util.write_text(data)

          # ACK 6.12 provides iommu_get_resv_regions(); do not use removed
          # bus->iommu_ops or nonexistent dev_iommu_ops() accessors.

          mem_buf_dev = Path("drivers/soc/qcom/mem_buf/mem-buf-dev.c")
          data = mem_buf_dev.read_text()
          old_remove = ("static int mem_buf_remove(struct platform_device *pdev)\n"
                        "{\n\tmem_buf_dev = NULL;\n\treturn 0;\n}")
          new_remove = ("static void mem_buf_remove(struct platform_device *pdev)\n"
                        "{\n\tmem_buf_dev = NULL;\n}")
          if data.count(old_remove) != 1:
              raise SystemExit("mem-buf: expected legacy platform remove callback not found exactly once")
          mem_buf_dev.write_text(data.replace(old_remove, new_remove, 1))

          # Restore the real Qualcomm Command DB standalone-state API. ACK's
          # implementation lacks this vendor extension, so implement it using
          # the reserved flag in the actual Command DB header.
          cmd_db = Path("drivers/soc/qcom/cmd-db.c")
          data = cmd_db.read_text()
          if "bool cmd_db_is_standalone(void)" not in data:
              marker = "EXPORT_SYMBOL_GPL(cmd_db_ready);\n"
              if data.count(marker) != 1:
                  raise SystemExit("Command DB: cmd_db_ready export insertion point not found")
              impl = ("\n#define CMD_DB_STANDALONE_MASK BIT(0)\n"
                      "bool cmd_db_is_standalone(void)\n"
                      "{\n"
                      "\tint ret = cmd_db_ready();\n"
                      "\tu32 standalone = le32_to_cpu(cmd_db_header->reserved) &\n"
                      "\t\t\t CMD_DB_STANDALONE_MASK;\n"
                      "\n"
                      "\treturn !ret && standalone;\n"
                      "}\n"
                      "EXPORT_SYMBOL(cmd_db_is_standalone);\n")
              data = data.replace(marker, marker + impl, 1)
              cmd_db.write_text(data)

          rpmh_rsc = Path("drivers/soc/qcom/rpmh-rsc.c")
          data = rpmh_rsc.read_text()
          if "rpmh_standalone = cmd_db_is_standalone();" not in data:
              raise SystemExit("RPMh RSC: real Command DB standalone-state call is missing")

          # Make RPMh timeout a real Kconfig symbol rather than hiding its
          # absence behind a C preprocessor fallback.
          qcom_kconfig = Path("drivers/soc/qcom/Kconfig")
          data = qcom_kconfig.read_text()
          if "config QCOM_RPMH_TIMEOUT" not in data:
              marker = "config QCOM_SMEM"
              if data.count(marker) != 1:
                  raise SystemExit("RPMh Kconfig insertion point not found")
              option = ("config QCOM_RPMH_TIMEOUT\n"
                        "\tint \"Timeout for RPMH and CRM communication\"\n"
                        "\tdefault 5000\n"
                        "\tdepends on QCOM_RPMH\n\n")
              data = data.replace(marker, option + marker, 1)
              qcom_kconfig.write_text(data)
          PY

          # Match ACK 6.12's IOMMU call site to the three-argument Qualcomm
          # restricted hook imported above. Preserve the actual DMA range.
          # ACK android16-6.12 keeps the legacy one-argument setup API.
          # The Qualcomm restricted hook needs the DMA aperture; pass the
          # domain's actual aperture bounds rather than fabricated constants.
          python3 -c 'from pathlib import Path; p=Path("drivers/iommu/dma-iommu.c"); s=p.read_text(); old="trace_android_rvh_iommu_setup_dma_ops(dev);"; new="trace_android_rvh_iommu_setup_dma_ops(dev, domain->geometry.aperture_start, domain->geometry.aperture_end);"; assert s.count(old)==1, f"Expected one old IOMMU hook call, found {s.count(old)}"; assert "void iommu_setup_dma_ops(struct device *dev)" in s, "Unexpected ACK android16-6.12 IOMMU setup API"; assert "iommu_dma_init_domain(domain, dev)" in s, "Expected legacy domain initialization is missing"; p.write_text(s.replace(old,new,1)); print("Adapted Qualcomm IOMMU hook to the ACK DMA aperture")'

          # Register the vendor memory-buffer and IOMMU providers in ACK's build graph.
          python3 - <<'PY'
          from pathlib import Path

          def add_before_last(path, marker, addition, label):
              p = Path(path)
              data = p.read_text()
              if addition.strip() in data:
                  return
              pos = data.rfind(marker)
              if pos < 0:
                  raise SystemExit(f"{label}: insertion marker not found in {path}")
              p.write_text(data[:pos] + addition + data[pos:])

          qcom_kconfig = Path("drivers/soc/qcom/Kconfig")
          qcom_makefile = Path("drivers/soc/qcom/Makefile")
          add_before_last(str(qcom_kconfig), "endmenu",
                          'source "drivers/soc/qcom/mem_buf/Kconfig"\n\n',
                          "QCOM MEM_BUF Kconfig")
          if "obj-$(CONFIG_QCOM_MEM_BUF) += mem_buf/" not in qcom_makefile.read_text():
              qcom_makefile.write_text(qcom_makefile.read_text() +
                  "\nobj-$(CONFIG_QCOM_MEM_BUF) += mem_buf/\n")

          iommu_kconfig = Path("drivers/iommu/Kconfig")
          iommu_makefile = Path("drivers/iommu/Makefile")
          if "config QCOM_IOMMU_UTIL" not in iommu_kconfig.read_text():
              add_before_last(str(iommu_kconfig), "endif",
                  'config QCOM_IOMMU_UTIL\n'
                  '\ttristate "Qualcomm IOMMU utility extensions"\n'
                  '\tdepends on IOMMU_SUPPORT\n'
                  '\thelp\n'
                  '\t  Qualcomm IOMMU range, SID-switch and stage-1 translation helpers.\n\n',
                  "QCOM IOMMU Kconfig")
          iommu_rules = (
              "\nobj-$(CONFIG_QCOM_IOMMU_UTIL) += qcom_iommu_util.o\n"
              "qcom_iommu_util-y += qcom-iommu-util.o\n"
              "qcom_iommu_util-$(CONFIG_IOMMU_IO_PGTABLE_FAST) += qcom-dma-iommu-generic.o io-pgtable-fast.o dma-mapping-fast.o\n"
              "qcom_iommu_util-$(CONFIG_IOMMU_IO_PGTABLE_LPAE) += qcom-io-pgtable-arm.o qcom-io-pgtable-alloc.o\n"
          )
          if "obj-$(CONFIG_QCOM_IOMMU_UTIL) += qcom_iommu_util.o" not in iommu_makefile.read_text():
              iommu_makefile.write_text(iommu_makefile.read_text() + iommu_rules)

          rpmh_header = Path("include/soc/qcom/rpmh.h")
          if "rpmh_mode_solver_set" not in rpmh_header.read_text():
              raise SystemExit("Vendor RPMh API header was not imported")
          config = Path("arch/arm64/configs/vendor/sky_GKI.config")
          cfg = config.read_text()
          for option in ("CONFIG_QCOM_IOMMU_UTIL=m", "CONFIG_QCOM_MEM_BUF=m",
                         "CONFIG_QCOM_RPMH_TIMEOUT=5000"):
              if option.split("=")[0] + "=" not in cfg:
                  cfg = cfg.rstrip() + "\n" + option + "\n"
          config.write_text(cfg)
          print("Registered SM4450 pinctrl, SPMI, RPMh, memory-buffer and IOMMU providers")
          PY

          # Port the Qualcomm secure-display SCM command used by SDE.
          # ACK 6.12 has the SCM transport, but not this SM4450 vendor command.
          python3 - <<'PY'
          from pathlib import Path

          scm_c = Path("drivers/firmware/qcom/qcom_scm.c")
          scm_h = Path("include/linux/firmware/qcom/qcom_scm.h")
          src = scm_c.read_text()
          api = scm_h.read_text()
          marker = "int qcom_scm_mem_protect_video_var("
          if "qcom_scm_mem_protect_sd_ctrl(" not in api:
              if marker not in api:
                  raise SystemExit("ACK SCM public header insertion point not found")
              api = api.replace(marker,
                  "int qcom_scm_mem_protect_sd_ctrl(u32 devid, phys_addr_t mem_addr, u64 mem_size, u32 vmid);\n" + marker, 1)
              scm_h.write_text(api)
          if "qcom_scm_mem_protect_sd_ctrl(" not in src:
              if marker not in src:
                  raise SystemExit("ACK SCM implementation insertion point not found")
              impl = '''#ifndef QCOM_SCM_MP_CMD_SD_CTRL
          #define QCOM_SCM_MP_CMD_SD_CTRL 0x18
          #endif
          int qcom_scm_mem_protect_sd_ctrl(u32 devid, phys_addr_t mem_addr,
                           u64 mem_size, u32 vmid)
          {
              struct qcom_scm_desc desc = {
                  .svc = QCOM_SCM_SVC_MP,
                  .cmd = QCOM_SCM_MP_CMD_SD_CTRL,
                  .owner = ARM_SMCCC_OWNER_SIP,
                  .args[0] = devid,
                  .args[1] = mem_addr,
                  .args[2] = mem_size,
                  .args[3] = vmid,
                  .arginfo = QCOM_SCM_ARGS(4, QCOM_SCM_VAL, QCOM_SCM_RW,
                               QCOM_SCM_VAL, QCOM_SCM_VAL),
              };
              struct qcom_scm_res res;
              int ret;

              ret = qcom_scm_call(__scm->dev, &desc, &res);
              return ret ? : res.result[0];
          }
          EXPORT_SYMBOL(qcom_scm_mem_protect_sd_ctrl);

          '''
              src = src.replace(marker, impl + marker, 1)
              scm_c.write_text(src)
          print("Applied SM4450 secure-display SCM API port")
          PY

          # Port the QTEE shared-memory bridge to the ACK 6.12 SCM API.
          # This is a separate module: QCOM_SCM is configured as a module on Sky,
          # so QTEE must follow it as a dependent module rather than being folded
          # into the qcom-scm composite object.
          mkdir -p drivers/firmware/qcom
          curl --fail --location --retry 3 --silent --show-error \
            "$HEADER_BASE/drivers/firmware/qtee_shmbridge.c" \
            -o drivers/firmware/qcom/qtee_shmbridge.c

          python3 - <<'PY'
          from pathlib import Path

          src_path = Path("drivers/firmware/qcom/qtee_shmbridge.c")
          src = src_path.read_text()

          def replace_once(old, new, label):
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              src = src.replace(old, new, 1)

          # Gunyah VMID handling and the vendor-only kernel-protection call are
          # not part of the HLOS Sky configuration. Keep the HLOS VMID path.
          for line in (
              "#include <soc/qcom/qseecomi.h>\n",
              "#include <linux/gunyah/gh_rm_drv.h>\n",
              '#include "qtee_shmbridge_internal.h"\n',
              "static bool support_hyp;\n",
              "\tgh_vmid_t temp_vmid;\n",
          ):
              if line not in src:
                  raise SystemExit(f"QTEE expected source fragment missing: {line.strip()}")
              src = src.replace(line, "", 1)

          replace_once(
              "\tif (support_hyp) {\n\n"
              "\t\t/* Calls to create SHMBridge from HLOS-VM is handled by QHEEBSP AC Layer while from\n"
              "\t\t * secondary CPU-VMs, such as OEM-VM and QTVM, it is handled by Hypervisor RM.\n"
              "\t\t * RM always expects the destination VM fields to be 0 and only expects the self\n"
              "\t\t * owner bit to be set.\n"
              "\t\t */\n\n"
              "\t\tif (ns_vmid_num == 1) {\n"
              "\t\t\tif (!gh_rm_get_this_vmid(&temp_vmid) &&\n"
              "\t\t\t\t(temp_vmid == ns_vmid_list[0])) {\n\n"
              "\t\t\t\tns_vmid_num = 0;\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t}\n\n",
              "",
              "remove unsupported hypervisor VMID branch")
          replace_once(
              "\tif (support_hyp) {\n"
              "\t\tsize_and_flags |= SELF_OWNER_BIT << 1;\n"
              "\t\tsize_and_flags |= (VM_PERM_R | VM_PERM_W) << 2;\n"
              "\t}\n\n",
              "",
              "remove unsupported hypervisor permission flags")
          replace_once(
              "ret = qcom_scm_create_shm_bridge(pfn_and_ns_perm_flags,\n"
              "\t\t\tipfn_and_s_perm_flags, size_and_flags, ns_vmids,\n"
              "\t\t\thandle);",
              "ret = qcom_scm_shm_bridge_create(default_bridge.dev,\n"
              "\t\t\tpfn_and_ns_perm_flags, ipfn_and_s_perm_flags,\n"
              "\t\t\tsize_and_flags, ns_vmids, handle);",
              "use ACK 6.12 SCM create API")
          replace_once("qcom_scm_delete_shm_bridge(handle)",
                       "qcom_scm_shm_bridge_delete(default_bridge.dev, handle)",
                       "use ACK 6.12 SCM delete API")
          replace_once("qcom_scm_enable_shm_bridge()",
                       "qcom_scm_shm_bridge_enable()",
                       "use ACK 6.12 SCM enable API")

          replace_once(
              "\tuint32_t *ns_vm_ids;\n"
              "\tuint32_t ns_vm_ids_hlos[] = {VMID_HLOS};\n"
              "\tuint32_t ns_vm_ids_hyp[] = {};\n"
              "\tuint32_t ns_vm_perms[] = {VM_PERM_R|VM_PERM_W};\n"
              "\tint mem_protection_enabled = 0;\n\n"
              "\tsupport_hyp = of_property_read_bool((&pdev->dev)->of_node,\n"
              "\t\t\t\"qcom,support-hypervisor\");\n"
              "\tif (support_hyp)\n"
              "\t\tns_vm_ids = ns_vm_ids_hyp;\n"
              "\telse\n"
              "\t\tns_vm_ids = ns_vm_ids_hlos;\n",
              "\tuint32_t ns_vm_ids[] = {VMID_HLOS};\n"
              "\tuint32_t ns_vm_perms[] = {VM_PERM_R | VM_PERM_W};\n",
              "use HLOS-only VMID configuration")
          replace_once(
              "\t/*register default bridge*/\n"
              "\tif (support_hyp)\n"
              "\t\tret = qtee_shmbridge_register(default_bridge.paddr,\n"
              "\t\t\tdefault_bridge.size, ns_vm_ids,\n"
              "\t\t\tns_vm_perms, 0, VM_PERM_R|VM_PERM_W,\n"
              "\t\t\t&default_bridge.handle);\n"
              "\telse\n"
              "\t\tret = qtee_shmbridge_register(default_bridge.paddr,\n"
              "\t\t\tdefault_bridge.size, ns_vm_ids,\n"
              "\t\t\tns_vm_perms, 1, VM_PERM_R|VM_PERM_W,\n"
              "\t\t\t&default_bridge.handle);",
              "\t/* Register the default bridge for the HLOS VM. */\n"
              "\tret = qtee_shmbridge_register(default_bridge.paddr,\n"
              "\t\tdefault_bridge.size, ns_vm_ids, ns_vm_perms,\n"
              "\t\tARRAY_SIZE(ns_vm_ids), VM_PERM_R | VM_PERM_W,\n"
              "\t\t&default_bridge.handle);",
              "register default bridge for HLOS")
          replace_once(
              "\tmem_protection_enabled = scm_mem_protection_init_do();\n"
              "\tpr_err(\"MEM protection %s, %d\\n\",\n"
              "\t\t\t(!mem_protection_enabled ? \"Enabled\" : \"Not enabled\"),\n"
              "\t\t\tmem_protection_enabled);\n",
              "",
              "remove vendor-only kernel-protection hook")

          # ACK's DMA API requires sync/unmap directions to match the original
          # mapping. QTEE buffers are shared in both directions.
          src = src.replace("DMA_TO_DEVICE);", "DMA_BIDIRECTIONAL);")
          src = src.replace("DMA_FROM_DEVICE);", "DMA_BIDIRECTIONAL);")

          replace_once(
              "\tif (IS_ERR_OR_NULL(shm)) {\n"
              "\t\tpr_err(\"qtee_shm is NULL\\n\");",
              "\tif (!default_bridge.genpool)\n"
              "\t\treturn -ENODEV;\n\n"
              "\tif (IS_ERR_OR_NULL(shm)) {\n"
              "\t\tpr_err(\"qtee_shm is NULL\\n\");",
              "guard allocation before bridge probe")
          replace_once(
              "\tif (IS_ERR_OR_NULL(shm) || !shm->vaddr)\n"
              "\t\treturn;",
              "\tif (!default_bridge.genpool || IS_ERR_OR_NULL(shm) || !shm->vaddr)\n"
              "\t\treturn;",
              "guard free before bridge probe")

          replace_once(
              "static int qtee_shmbridge_remove(struct platform_device *pdev)\n"
              "{\n"
              "\tqtee_shmbridge_deregister(default_bridge.handle);\n"
              "\tgen_pool_destroy(default_bridge.genpool);\n"
              "\tdma_unmap_single(&pdev->dev, default_bridge.paddr, default_bridge.size,\n"
              "\t\t\tDMA_BIDIRECTIONAL);\n"
              "\tfree_pages((long)default_bridge.vaddr, get_order(default_bridge.size));\n"
              "\treturn 0;\n"
              "}",
              "static void qtee_shmbridge_remove(struct platform_device *pdev)\n"
              "{\n"
              "\tqtee_shmbridge_deregister(default_bridge.handle);\n"
              "\tgen_pool_destroy(default_bridge.genpool);\n"
              "\tdma_unmap_single(&pdev->dev, default_bridge.paddr, default_bridge.size,\n"
              "\t\t\tDMA_BIDIRECTIONAL);\n"
              "\tfree_pages((long)default_bridge.vaddr, get_order(default_bridge.size));\n"
              "\tdefault_bridge.genpool = NULL;\n"
              "\tdefault_bridge.vaddr = NULL;\n"
              "\tdefault_bridge.paddr = 0;\n"
              "\tdefault_bridge.handle = 0;\n"
              "}",
              "match Linux 6.12 void platform remove callback")

          replace_once(
              "#ifdef CONFIG_ARM64\n"
              "\tdma_set_mask(&pdev->dev, DMA_BIT_MASK(64));\n"
              "#endif\n"
              "\treturn qtee_shmbridge_init(pdev);",
              "#ifdef CONFIG_ARM64\n"
              "\tint ret = dma_set_mask(&pdev->dev, DMA_BIT_MASK(64));\n"
              "\tif (ret)\n"
              "\t\treturn ret;\n"
              "#endif\n"
              "\treturn qtee_shmbridge_init(pdev);",
              "check DMA mask setup")
          replace_once(
              "int qtee_shmbridge_driver_init(void)\n"
              "{\n"
              "\treturn platform_driver_register(&qtee_shmbridge_driver);\n"
              "}\n\n"
              "void qtee_shmbridge_driver_exit(void)\n"
              "{\n"
              "\tplatform_driver_unregister(&qtee_shmbridge_driver);\n"
              "}",
              "module_platform_driver(qtee_shmbridge_driver);",
              "register QTEE as a dependent module")

          # This vendor source is converted into a loadable module. Add the
          # module metadata required by Linux 6.12 MODPOST at file scope.
          src += '\nMODULE_DESCRIPTION("Qualcomm TEE shared memory bridge");\n'
          src += 'MODULE_LICENSE("GPL v2");\n'

          src_path.write_text(src)

          kconfig_path = Path("drivers/firmware/qcom/Kconfig")
          kconfig = kconfig_path.read_text()
          config_marker = "config QCOM_TZMEM\n"
          qtee_config = (
              "config QTEE_SHM_BRIDGE\n"
              "\ttristate \"Qualcomm TEE shared memory bridge\"\n"
              "\tdepends on QCOM_SCM && OF\n"
              "\thelp\n"
              "\t  Enable the Qualcomm TEE shared-memory bridge used by\n"
              "\t  vendor display and secure-memory clients.\n\n"
          )
          if "config QTEE_SHM_BRIDGE" not in kconfig:
              if kconfig.count(config_marker) != 1:
                  raise SystemExit("QCOM Kconfig insertion point not found")
              kconfig = kconfig.replace(config_marker, qtee_config + config_marker, 1)
              kconfig_path.write_text(kconfig)

          makefile_path = Path("drivers/firmware/qcom/Makefile")
          makefile = makefile_path.read_text()
          make_marker = "obj-$(CONFIG_QCOM_TZMEM)\t+= qcom_tzmem.o\n"
          qtee_object = "obj-$(CONFIG_QTEE_SHM_BRIDGE)\t+= qtee_shmbridge.o\n"
          if "qtee_shmbridge.o" not in makefile:
              if make_marker not in makefile:
                  raise SystemExit("QCOM Makefile insertion point not found")
              makefile = makefile.replace(make_marker, qtee_object + make_marker, 1)
              makefile_path.write_text(makefile)

          config_path = Path("arch/arm64/configs/vendor/sky_GKI.config")
          config = config_path.read_text()
          if "CONFIG_QTEE_SHM_BRIDGE=" not in config:
              config_path.write_text(config.rstrip() + "\nCONFIG_QTEE_SHM_BRIDGE=m\n")

          print("QTEE SHM bridge ported to ACK 6.12 SCM API and enabled as a dependent module")
          PY

          # Copy Qualcomm vendor DT-bindings from sm4450-devicetrees.
          # ACK 6.12 does not guarantee that the destination directory exists.
          if [ -d "../sm4450-devicetrees/include/dt-bindings" ]; then
            echo "Copying Qualcomm vendor DT-bindings from sm4450-devicetrees..."
            mkdir -p include/dt-bindings
            cp -rf ../sm4450-devicetrees/include/dt-bindings/. include/dt-bindings/
          fi

          # ACK/GKI 6.12 may not ship a Qualcomm DTS directory. Create the
          # destination explicitly before importing the matching SM4450 DTS tree.
          echo "Setting up Devicetrees inside arch/arm64/boot/dts/qcom..."
          test -f ../sm4450-devicetrees/qcom/Makefile || {
            echo "FATAL ERROR: SM4450 devicetree source is missing qcom/Makefile"
            exit 1
          }
          mkdir -p arch/arm64/boot/dts/qcom
          cp -a ../sm4450-devicetrees/qcom/. arch/arm64/boot/dts/qcom/

          # Qualcomm vendor DTS subdirectories ship wrapper Makefiles and Kbuild
          # files together. The wrappers mask the in-tree Kbuild and invoke the
          # external-DTS flow, which ACK's dtbs recursion cannot use. Keep each
          # directory's in-tree Kbuild and adapt vendor .dts overlays to the
          # .dtso source suffix consumed by ACK 6.12's DTBO pattern rule. Some
          # vendor Kbuilds reference overlays in nested paths (for example
          # display/display/*.dtbo), so conversion must recurse below each
          # Qualcomm DTS subdirectory rather than checking only its top level.
          while IFS= read -r kbuild; do
            dir="${kbuild%/Kbuild}"
            if [ -f "$dir/Makefile" ]; then
              echo "Removing external-DTS wrapper: $dir/Makefile"
              rm -f "$dir/Makefile"
            fi
            find "$dir" -type f -name '*.dts' -print0 |
              while IFS= read -r -d '' dts; do
                dtso="${dts%.dts}.dtso"
                [ -e "$dtso" ] || cp "$dts" "$dtso"
              done
          done < <(find arch/arm64/boot/dts/qcom -mindepth 2 -maxdepth 2 -type f -name Kbuild -print)

          # Do not recurse into audio/: its Kbuild is an external-DT wrapper and
          # the recursive sub-make does not inherit scripts/Makefile.dtbs rules.
          # Build the Sky audio overlay from the qcom parent Kbuild instead.
          sed -i 's/^subdir-y[[:space:]]*+=[[:space:]]*audio[[:space:]]*/subdir-y += /' arch/arm64/boot/dts/qcom/Makefile

          # Vendor audio DTS includes are supplied by the matching modules checkout.
          printf '\nDTC_INCLUDE += $(srctree)/../sm4450-modules/qcom/opensource/audio-kernel/include\n' >> arch/arm64/boot/dts/qcom/Makefile

          # Register Sky DTBs and audio overlay in the parent qcom build.
          printf "\n# Xiaomi Sky DTB and audio overlay targets\nDTC_FLAGS += -@\ndtb-y += ravelin-sky-base.dtb ravelin-sky-4gb-base.dtb\ndtb-y += ravelin-sky-overlay.dtbo ravelin-sky-4gb-overlay.dtbo\ndtb-y += audio/ravelin-audio-xiaomi-sky.dtbo\nalways-y += ravelin-sky-base.dtb ravelin-sky-4gb-base.dtb ravelin-sky-overlay.dtbo ravelin-sky-4gb-overlay.dtbo audio/ravelin-audio-xiaomi-sky.dtbo\n" >> arch/arm64/boot/dts/qcom/Makefile

          # Ensure arch/arm64/boot/dts/Makefile descends into qcom
          echo 'subdir-y += qcom' > arch/arm64/boot/dts/Makefile
          rm -rf arch/arm64/boot/dts/vendor

          mkdir -p out
          echo "Configuring gki_defconfig..."
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

          echo "Merging vendor sky_GKI.config..."
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sky_GKI.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig

          echo "Compiling Linux 6.12 Kernel Image and DTBs..."
          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_FLAGS="-@" \
            CONFIG_XIAOMI_DEVICE_DTBS=y \
            CONFIG_SKY_DTB=y \
            Image dtbs 2>&1 | tee make.log

          echo "=== Verifying DTB Compilation ==="
          ls -la out/arch/arm64/boot/dts/qcom/*sky* 2>/dev/null || true
          for dtb in ravelin-sky-base.dtb ravelin-sky-4gb-base.dtb; do
            if [ ! -s "out/arch/arm64/boot/dts/qcom/$dtb" ]; then
              echo "FATAL ERROR: $dtb was not compiled!"
              grep -E "DTC|dtb|DTS|error" make.log | tail -n 80
              exit 1
            fi
          done

          echo "Compiling Linux 6.12 In-Tree Modules..."
          make -k -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log

          echo "Compiling Xiaomi Out-of-Tree Modules..."
          make -k -j$(nproc --all) -C $PWD O=out \
            M=$(realpath ../sm4450-modules/xiaomi) \
            EXTRA_CFLAGS="-I$(realpath ../sm4450-modules/xiaomi/include) -Wno-error" \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log

          echo "Verifying Xiaomi exported-symbol manifest..."
          XIAOMI_SYMVERS="$(realpath ../sm4450-modules/xiaomi/Module.symvers)"
          if [ ! -s "$XIAOMI_SYMVERS" ]; then
            echo "FATAL ERROR: Xiaomi Module.symvers was not generated at $XIAOMI_SYMVERS"
            find ../sm4450-modules/xiaomi -name Module.symvers -type f -print
            exit 1
          fi
          for symbol in xiaomi_touch_notifier_register_client xiaomi_touch_notifier_unregister_client ktd3136_bl_set_brightness ktd3136_reg_init ocp2131_enable; do
            if ! grep -qE "[[:space:]]${symbol}[[:space:]]" "$XIAOMI_SYMVERS"; then
              echo "FATAL ERROR: Xiaomi Module.symvers does not export $symbol"
              exit 1
            fi
          done
          echo "Using Xiaomi exported symbols from: $XIAOMI_SYMVERS"

          echo "Compiling Qualcomm Display Drivers (msm_drm)..."
          make -k -j$(nproc --all) -C $PWD O=out \
            M=$(realpath ../sm4450-modules/qcom/opensource/display-drivers/msm) \
            DISPLAY_ROOT=$(realpath ../sm4450-modules/qcom/opensource/display-drivers) \
            KBUILD_EXTRA_SYMBOLS="$XIAOMI_SYMVERS" \
            EXTRA_CFLAGS="-I$(realpath ../sm4450-modules/qcom/opensource/display-drivers/include) -I$(realpath ../sm4450-modules/xiaomi/include) -Wno-error" \
            CONFIG_ARCH_RAVELIN=y \
            KERNEL_SRC=$PWD \
            KERNEL_ROOT=$PWD \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee -a make.log

          echo "=== COMPILED MODULES COUNT ==="
          find out ../sm4450-modules -name "*.ko" | wc -l
          find out ../sm4450-modules -name "*.ko" | head -n 30 || true

          echo "=== REQUIRED SKY PLATFORM MODULES ==="
          for module in pinctrl-parrot.ko pinctrl-ravelin.ko qnoc-parrot.ko qnoc-ravelin.ko gcc-parrot.ko dispcc-parrot.ko camcc-parrot.ko gpucc-parrot.ko videocc-parrot.ko; do
            if ! find out -name "$module" -print -quit | grep -q .; then
              echo "FATAL ERROR: required platform module $module was not built"
              exit 1
            fi
          done

          echo "=== CCACHE STATISTICS ==="
          ccache -s

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image (out/arch/arm64/boot/Image) was not generated!"
            exit 1
          fi

      - name: Save Ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-6.12-ccache-${{ github.run_id }}

      - name: Package Boot, Vendor Boot & DTBO Images (85%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [████████░░] 85%%0A<b>Step:</b> Building boot, vendor_boot, and dtbo images..." || true
          cd workspace
          mkdir -p artifacts

          echo "1. Generating header v4 boot-6.12.img..."
          bash ../scripts/build_boot.sh kernel/out/arch/arm64/boot/Image artifacts/boot-6.12.img

          echo "2. Generating dtbo-6.12.img..."
          SKY_DTBOS=$(find kernel/out/arch/arm64/boot/dts -name "*sky*.dtbo" 2>/dev/null | sort -r | tr '\n' ' ')
          for dtbo in ravelin-sky-overlay.dtbo ravelin-sky-4gb-overlay.dtbo; do
            if ! find kernel/out/arch/arm64/boot/dts -name "$dtbo" -print -quit | grep -q .; then
              echo "FATAL ERROR: required compiled overlay $dtbo is missing"
              exit 1
            fi
          done
          if [ -z "${SKY_DTBOS// }" ]; then
            echo "FATAL ERROR: no sky DTBOs were compiled; refusing to substitute a reference DTBO image"
            exit 1
          fi
          echo "Packing compiled DTBOs: $SKY_DTBOS"
          python3 ../scripts/mkdtboimg.py create artifacts/dtbo-6.12.img --page_size=4096 $SKY_DTBOS
          test -s artifacts/dtbo-6.12.img

          echo "3. Generating vendor_boot-6.12.img (with 6.12 modules in Fragment 0 & OrangeFox in Fragment 1)..."
          bash ../scripts/build_vendor_boot.sh kernel/out/arch/arm64/boot/dts . artifacts/vendor_boot-6.12.img

          ls -lh artifacts/

      - name: Prepare AnyKernel3 Zip & Fastboot Bundle (95%)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Linux 6.12 Build</b>%0A%0A<b>Progress:</b> [█████████░] 95%%0A<b>Step:</b> Packaging AnyKernel3 & Fastboot flashables..." || true
          cd workspace
          git clone --depth=1 https://github.com/AltafYafai/AnyKernel3.git AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f artifacts/dtbo-6.12.img ] && cp artifacts/dtbo-6.12.img AnyKernel3/dtbo.img
          [ -f artifacts/vendor_boot-6.12.img ] && cp artifacts/vendor_boot-6.12.img AnyKernel3/vendor_boot.img

          # Flatten base Sky device trees
          find kernel/out/arch/arm64/boot/dts -name "*sky*base.dtb" -exec cat {} + > AnyKernel3/dtb || true
          [ -s AnyKernel3/dtb ] || rm -f AnyKernel3/dtb

          # Collect all compiled hardware modules (.ko)
          mkdir -p AnyKernel3/modules
          find kernel/out sm4450-modules -name "*.ko" -exec cp {} AnyKernel3/modules/ \; || true
          llvm-strip --strip-debug AnyKernel3/modules/*.ko 2>/dev/null || true

          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Sky Linux 6.12 LTS Kernel for Redmi 12 5G/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=sky/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi12_5g/' anykernel.sh
          sed -i 's/block=.*/block=boot;/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh

          # Inject flash_generic vendor_boot and flash_dtbo triggers
          if ! grep -q "flash_generic vendor_boot" anykernel.sh; then
            sed -i '/## end boot install/i [ -f vendor_boot.img ] \&\& flash_generic vendor_boot' anykernel.sh
          fi
          if ! grep -q "flash_dtbo" anykernel.sh; then
            sed -i '/## end boot install/i [ -f dtbo.img ] \&\& flash_dtbo' anykernel.sh
          fi

          zip -r9 ../sky-kernel-6.12-${{ env.KERNEL_REV }}.zip * -x .git\* README.md
          cd ..

          # Create Fastboot flashing package
          mkdir -p fastboot_bundle
          cp artifacts/boot-6.12.img fastboot_bundle/boot.img
          cp artifacts/vendor_boot-6.12.img fastboot_bundle/vendor_boot.img
          [ -f artifacts/dtbo-6.12.img ] && cp artifacts/dtbo-6.12.img fastboot_bundle/dtbo.img

          cat << 'EOF' > fastboot_bundle/flash.sh
          #!/usr/bin/env bash
          set -e
          echo "=== Flashing Sky Linux 6.12 Kernel ==="
          fastboot flash boot boot.img
          fastboot flash vendor_boot vendor_boot.img
          [ -f dtbo.img ] && fastboot flash dtbo dtbo.img
          echo "=== Flashing Complete! Rebooting... ==="
          fastboot reboot
          EOF
          chmod +x fastboot_bundle/flash.sh

          cat << 'EOF' > fastboot_bundle/flash.bat
          @echo off
          echo === Flashing Sky Linux 6.12 Kernel ===
          fastboot flash boot boot.img
          fastboot flash vendor_boot vendor_boot.img
          if exist dtbo.img fastboot flash dtbo dtbo.img
          echo === Flashing Complete! Rebooting... ===
          fastboot reboot
          EOF

          cd fastboot_bundle
          zip -r9 ../sky-fastboot-6.12-${{ env.KERNEL_REV }}.zip *
          cd ..

          cp artifacts/*.img .

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sky-kernel-6.12-${{ env.KERNEL_REV }}
          path: |
            workspace/sky-kernel-6.12-*.zip
            workspace/sky-fastboot-6.12-*.zip
            workspace/*.img

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          TAG_NAME="sky-6.12-${{ env.KERNEL_REV }}-$(date +%Y%m%d-%H%M)"
          echo "Publishing GitHub release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            workspace/sky-kernel-6.12-*.zip \
            workspace/sky-fastboot-6.12-*.zip \
            workspace/*.img \
            --title "Sky Linux 6.12 Kernel ($TAG_NAME)" \
            --notes "Linux 6.12 GKI LTS build for Xiaomi Redmi 12 5G / POCO M6 Pro 5G (sky). Includes AnyKernel3 recovery zip, 1-click Fastboot bundle, boot, vendor_boot (with 6.12 modules and DTBs), and dtbo images." || true

      - name: Notify Build Complete (100%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>✅ Xiaomi Sky Linux 6.12 Kernel Build Completed!</b>%0A%0A<b>Progress:</b> [██████████] 100%%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Success! Uploading packages..." || true
          ZIP_FILE=$(ls workspace/sky-kernel-6.12-*.zip 2>/dev/null | head -n1)
          if [ -f "$ZIP_FILE" ]; then
            ./.telegram/tg.sh send_document "$ZIP_FILE" "<b>📦 Flashable Recovery Zip:</b> $(basename $ZIP_FILE)" || true
          fi
          FASTBOOT_ZIP=$(ls workspace/sky-fastboot-6.12-*.zip 2>/dev/null | head -n1)
          if [ -f "$FASTBOOT_ZIP" ]; then
            ./.telegram/tg.sh send_document "$FASTBOOT_ZIP" "<b>⚡ Fastboot Flash Package:</b> $(basename $FASTBOOT_ZIP)" || true
          fi

      - name: Handle Build Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p /tmp/logs
          LOG_FILE="/tmp/logs/build_error_${{ github.run_id }}.log"
          
          echo "=== BUILD FAILURE LOG REPORT ===" > "$LOG_FILE"
          echo "Run ID: ${{ github.run_id }}" >> "$LOG_FILE"
          echo "Workflow: ${{ github.workflow }}" >> "$LOG_FILE"
          echo "Commit: ${{ env.KERNEL_REV }}" >> "$LOG_FILE"
          echo "Timestamp: $(date -u)" >> "$LOG_FILE"
          echo -e "\n=== ERROR DETAILS ===" >> "$LOG_FILE"
          
          if [ -f workspace/kernel/make.log ]; then
            tail -n 250 workspace/kernel/make.log >> "$LOG_FILE"
          elif [ -f workspace/kernel/out/make.log ]; then
            tail -n 250 workspace/kernel/out/make.log >> "$LOG_FILE"
          else
            echo "Step failed before compilation log creation." >> "$LOG_FILE"
          fi

          ./.telegram/tg.sh update "<b>❌ Xiaomi Sky Linux 6.12 Build Failed!</b>%0A%0A<b>Run ID:</b> ${{ github.run_id }}%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Failed! See attached error log."
          ./.telegram/tg.sh send_document "$LOG_FILE" "<b>📄 Build Error Log:</b> build_error_${{ github.run_id }}.log" || true
