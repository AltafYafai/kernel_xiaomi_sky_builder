name: Build Xiaomi Sky Kernel (lineage-24.0)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-24.0'
      MODULES_BRANCH:
        description: 'Modules Source Branch'
        required: true
        default: 'lineage-24.0'
      BUILD_KSU:
        description: 'Include KernelSU-Next'
        required: false
        type: boolean
        default: true
      BUILD_SUSFS:
        description: 'Include SUSFS'
        required: false
        type: boolean
        default: true
      TELEGRAM_CHAT_ID:
        description: 'Telegram Chat ID'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Telegram Helper
        run: |
          mkdir -p .telegram
          cat << 'EOF' > .telegram/tg.sh
          #!/usr/bin/env bash
          BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-${INPUT_TELEGRAM_CHAT_ID}}"

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram credentials missing, skipping telegram update."
            exit 0
          fi

          ACTION="$1"
          TEXT="$2"
          MSG_ID_FILE="/tmp/tg_msg_id.txt"

          if [ "$ACTION" = "start" ]; then
            RES=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${TEXT}")
            MSG_ID=$(echo "$RES" | jq -r '.result.message_id' 2>/dev/null || true)
            if [ -n "$MSG_ID" ] && [ "$MSG_ID" != "null" ]; then
              echo "$MSG_ID" > "$MSG_ID_FILE"
            fi
          elif [ "$ACTION" = "update" ]; then
            if [ -f "$MSG_ID_FILE" ]; then
              MSG_ID=$(cat "$MSG_ID_FILE")
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_id=${MSG_ID}" \
                -d "parse_mode=HTML" \
                -d "text=${TEXT}" > /dev/null
            else
              $0 start "$TEXT"
            fi
          elif [ "$ACTION" = "send_document" ]; then
            FILE_PATH="$(realpath "$2")"
            CAPTION="$3"
            if [ ! -f "$FILE_PATH" ]; then
              echo "Error: File to upload does not exist: $FILE_PATH"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$FILE_PATH" 2>/dev/null || wc -c < "$FILE_PATH")
            echo "Uploading $FILE_PATH ($((FILE_SIZE / 1024 / 1024)) MB) to Telegram..."

            RES=$(curl -s -S \
              -H "Expect:" \
              --connect-timeout 60 \
              --max-time 600 \
              --retry 3 \
              --retry-delay 5 \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${FILE_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
            echo "Telegram API response: $RES"

            if ! echo "$RES" | grep -q '"ok":true'; then
              echo "Initial upload failed, retrying without HTML caption formatting..."
              RES=$(curl -s -S \
                -H "Expect:" \
                --connect-timeout 60 \
                --max-time 600 \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE_PATH}" \
                -F "caption=$(basename "$FILE_PATH")" \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
              echo "Fallback Telegram API response: $RES"
            fi
          fi
          EOF
          chmod +x .telegram/tg.sh

      - name: Notify Build Started (0%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh start "<b>🔨 Xiaomi Sky Kernel Build Started</b>%0A%0A<b>Progress:</b> [░░░░░░░░░░] 0%%0A<b>Step:</b> Initializing Build Environment"

      - name: Install dependencies (10%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [█░░░░░░░░░] 10%%0A<b>Step:</b> Installing system dependencies..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ccache libssl-dev bison flex libelf-dev build-essential zip curl libncurses-dev bc python3 python3-pip openjdk-11-jdk rsync u-boot-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi jq

      - name: Setup Ccache Caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Set up build environment directory
        run: |
          mkdir -p workspace

      - name: Clone Kernel & Modules Source (25%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [██░░░░░░░░] 25%%0A<b>Step:</b> Cloning Kernel & Modules sources..."
          cd workspace
          git clone -b ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1 https://github.com/AltafYafai/kernel_xiaomi_sky.git kernel
          cd kernel
          echo "KERNEL_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          cd ..
          git clone -b ${{ github.event.inputs.MODULES_BRANCH }} --depth=1 https://github.com/AltafYafai/kernel_xiaomi_sky-modules.git kernel/vendor/qcom/opensource/mm-drivers

      - name: Setup Clang Toolchain (40%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [████░░░░░░] 40%%0A<b>Step:</b> Downloading and setting up Clang toolchain..."
          cd workspace
          mkdir -p clang
          curl -LSs https://github.com/proton-clang/proton-clang/archive/refs/heads/master.tar.gz | tar -xz -C clang --strip-components=1

      - name: Setup KernelSU-Next and SUSFS (55%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [█████░░░░░] 55%%0A<b>Step:</b> Patching KernelSU-Next and SUSFS..."
          cd workspace/kernel
          if [ "${{ github.event.inputs.BUILD_KSU }}" = "true" ]; then
            echo "==> Integrating KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi
          if [ "${{ github.event.inputs.BUILD_SUSFS }}" = "true" ]; then
            echo "==> Integrating SUSFS..."
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
            cp -r susfs/kernel_patches/fs/* fs/
            cp -r susfs/kernel_patches/include/linux/* include/linux/
            cp -r susfs/kernel_patches/5.10/* . || true
          fi
          sed -i 's/#include <linux\/types.h>/#include <linux\/types.h>\n#include <linux\/errno.h>/' include/soc/qcom/socinfo.h || true

      - name: Build Kernel and Modules (75%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [███████░░░] 75%%0A<b>Step:</b> Compiling Kernel Image & Drivers (LLVM=1)..."
          cd workspace/kernel
          export PATH=$GITHUB_WORKSPACE/workspace/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=AltafYafai

          # Configure ccache for maximum compilation speed
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=5
          export CCACHE_SLOPPY=time_macros,include_file_mtime,file_macro
          ccache -z

          make O=out ARCH=arm64 gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sky_GKI.config
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee make.log

          echo "=== CCACHE STATISTICS ==="
          ccache -s

      - name: Prepare AnyKernel3 Zip (90%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>🔨 Xiaomi Sky Kernel Build</b>%0A%0A<b>Progress:</b> [█████████░] 90%%0A<b>Step:</b> Packaging AnyKernel3 Flashable Zip..."
          cd workspace
          git clone --depth=1 https://github.com/AltafYafai/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/ \; || true
          llvm-strip --strip-unneeded AnyKernel3/modules/*.ko 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Sky Kernel for Redmi 12 5G/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=sky/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi12_5g/' anykernel.sh
          sed -i 's/^block=.*/block=boot/' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' anykernel.sh
          zip -r9 ../sky-kernel-${{ env.KERNEL_REV }}.zip * -x .git\* README.md

      - name: Upload Kernel Artifact & Notify Complete (100%)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          ./.telegram/tg.sh update "<b>✅ Xiaomi Sky Kernel Build Completed!</b>%0A%0A<b>Progress:</b> [██████████] 100%%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Success! Uploading zip to Telegram..." || true
          ZIP_FILE=$(find workspace -maxdepth 1 -name "sky-kernel-*.zip" 2>/dev/null | head -n1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found flashable zip: $ZIP_FILE"
            ./.telegram/tg.sh send_document "$ZIP_FILE" "<b>📦 Flashable Kernel Zip:</b> $(basename "$ZIP_FILE")"
            ./.telegram/tg.sh update "<b>✅ Xiaomi Sky Kernel Build Completed!</b>%0A%0A<b>Progress:</b> [██████████] 100%%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Success! Flashable zip delivered." || true
          else
            echo "Error: Flashable zip not found in workspace!"
            ./.telegram/tg.sh update "<b>⚠️ Xiaomi Sky Build Completed</b>%0A%0A<b>Warning:</b> Flashable zip not found for Telegram upload!" || true
          fi

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sky-kernel-${{ env.KERNEL_REV }}
          path: workspace/sky-kernel-*.zip

      - name: Handle Build Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p /tmp/logs
          LOG_FILE="/tmp/logs/build_error_${{ github.run_id }}.log"
          
          echo "=== BUILD FAILURE LOG REPORT ===" > "$LOG_FILE"
          echo "Run ID: ${{ github.run_id }}" >> "$LOG_FILE"
          echo "Workflow: ${{ github.workflow }}" >> "$LOG_FILE"
          echo "Commit: ${{ env.KERNEL_REV }}" >> "$LOG_FILE"
          echo "Timestamp: $(date -u)" >> "$LOG_FILE"
          echo -e "\n=== ERROR DETAILS ===" >> "$LOG_FILE"
          
          if [ -f workspace/kernel/make.log ]; then
            tail -n 200 workspace/kernel/make.log >> "$LOG_FILE"
          elif [ -f workspace/kernel/out/make.log ]; then
            tail -n 200 workspace/kernel/out/make.log >> "$LOG_FILE"
          else
            echo "Step failed before compilation log creation." >> "$LOG_FILE"
          fi

          ./.telegram/tg.sh update "<b>❌ Xiaomi Sky Kernel Build Failed!</b>%0A%0A<b>Run ID:</b> ${{ github.run_id }}%0A<b>Commit:</b> ${{ env.KERNEL_REV }}%0A<b>Status:</b> Failed! See attached error log."
          ./.telegram/tg.sh send_document "$LOG_FILE" "<b>📄 Build Error Log:</b> build_error_${{ github.run_id }}.log" || true




