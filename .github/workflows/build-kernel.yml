name: Build Xiaomi Sky Kernel (lineage-24.0)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-24.0'
      MODULES_BRANCH:
        description: 'Modules Source Branch'
        required: true
        default: 'lineage-24.0'
      BUILD_KSU:
        description: 'Include KernelSU-Next'
        required: false
        type: boolean
        default: true
      BUILD_SUSFS:
        description: 'Include SUSFS'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache libssl-dev bison flex libelf-dev build-essential zip curl libssl-dev libncurses-dev bc python3 python3-pip openjdk-11-jdk rsync u-boot-tools

      - name: Set up build environment directory
        run: |
          mkdir -p workspace
          cd workspace

      - name: Clone Kernel Source
        run: |
          cd workspace
          git clone -b ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1 https://github.com/AltafYafai/kernel_xiaomi_sky.git kernel
          cd kernel
          echo "KERNEL_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Clone Modules Source
        run: |
          cd workspace
          git clone -b ${{ github.event.inputs.MODULES_BRANCH }} --depth=1 https://github.com/AltafYafai/kernel_xiaomi_sky-modules.git kernel/vendor/qcom/opensource/mm-drivers

      - name: Setup Clang Toolchain
        run: |
          cd workspace
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Setup KernelSU-Next and SUSFS
        run: |
          cd workspace/kernel
          if [ "${{ github.event.inputs.BUILD_KSU }}" = "true" ]; then
            echo "==> Integrating KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/rifs280/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi
          if [ "${{ github.event.inputs.BUILD_SUSFS }}" = "true" ]; then
            echo "==> Integrating SUSFS..."
            git clone --depth=1 https://gitlab.com/simonpang/susfs4ksu.git -b gki-android12-5.10 susfs
            cp -r susfs/kernel_patches/fs/* fs/
            cp -r susfs/kernel_patches/include/linux/* include/linux/
            cp -r susfs/kernel_patches/5.10/* . || true
          fi

      - name: Build Kernel and Modules
        run: |
          cd workspace/kernel
          export PATH=$GITHUB_WORKSPACE/workspace/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=AltafYafai

          make O=out vendor/sky_defconfig
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Prepare AnyKernel3 Zip
        run: |
          cd workspace
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/ || cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../sky-kernel-${{ env.KERNEL_REV }}.zip * -x .git\* README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-kernel-${{ env.KERNEL_REV }}
          path: workspace/sky-kernel-*.zip
